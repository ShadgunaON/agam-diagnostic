}

type Query {
  #  Admin Bookings Workspace (paginated; replaces REST GET /api/bookings)
  adminBookingsWorkspace(cursor: String, limit: Int, search: String, sort: String, status: String, tab: String): AdminBookingsWorkspace!
  #  Admin Catalog Workspace
  adminCatalogWorkspace: CatalogWorkspace!
  #  Admin Collections Workspace
  adminCollectionsWorkspace(cursor: String, limit: Int, search: String, sort: String, tab: String): CollectionsWorkspaceData!
  #  Admin Invoices Workspace (paginated; replaces REST GET /api/invoices)
  adminInvoicesWorkspace(cursor: String, limit: Int, search: String, status: String): AdminInvoicesWorkspace!
  adminPermissionsMap: String!
  #  Admin Reports Workspace
  adminReportsWorkspace(cursor: String, limit: Int, search: String, sort: String, status: String): AdminReportsWorkspaceData!
  #  Admin Reviews Workspace (paginated; replaces REST GET /api/reviews)
  adminReviewsWorkspace(cursor: String, limit: Int, rating: String, search: String, status: String): AdminReviewsWorkspace!
  adminRoles: [Role!]! @aws_cognito_user_pools
  #  Staff Management
  adminStaffWorkspace: [Staff!]!
  allReviews(cursor: String, limit: Int): ReviewConnection!
  #  Admin Analytics Charts (revenue aggregated server-side)
  analyticsCharts: AnalyticsCharts!
  blogById(idOrSlug: String!): BlogItem @aws_api_key @aws_cognito_user_pools
  #  Blog Queries
  blogs(limit: Int, page: Int, status: String): [BlogItem!]! @aws_api_key @aws_cognito_user_pools
  #  Targeted single-record lookups (replaces REST GET /api/bookings/:id and /api/invoices/:id)
  bookingById(id: ID!): Booking
  #  Booking Queries
  bookingsByPatient(patientId: ID!): [Booking!]!
  catalogPackages(limit: Int, page: Int, q: String): CatalogPackagesConnection! @aws_api_key @aws_cognito_user_pools
  catalogServices(limit: Int, page: Int, q: String): CatalogServicesConnection! @aws_api_key @aws_cognito_user_pools
  #  Catalog Queries
  catalogTests(limit: Int, page: Int, q: String): CatalogTestsConnection! @aws_api_key @aws_cognito_user_pools
  #  Collection Queries
  collectionById(id: ID!): CollectionTask
  collections(cursor: String, limit: Int, search: String, status: String): CollectionConnection!
  collectionsByPatient(patientId: ID!): [CollectionTask!]!
  #  Admin Dashboard
  dashboardStats: DashboardMetrics!
  documentById(id: ID!): DocumentItem
  documentDownloadUrl(id: ID!): String!
  #  Document Queries
  documents(entityId: ID, entityType: String): [DocumentItem!]!
  #  Aggregated Search
  globalSearch(limit: Int, query: String!): [GlobalSearchResult!]! @aws_api_key @aws_cognito_user_pools
  invoiceById(id: ID!): FullInvoice
  #  Invoice Queries
  invoicesByPatient(patientId: ID!): [Invoice!]!
  #  Patient Queries
  mePatient: Patient
  #  Patient-scoped booking list (replaces REST GET /api/bookings?patientId=)
  myBookings: [Booking!]!
  #  Patient portal notifications (replaces REST GET /api/notifications)
  myNotifications: [Notification!]!
  #  Patient Portal
  myPortal: MyPortal!
  #  Newsletter
  newsletterSubscribers(cursor: String, limit: Int): SubscriberConnection!
  packageById(id: ID!): PackageItem
  packageBySlug(slug: String!): PackageItem @aws_api_key @aws_cognito_user_pools
  #  Direct Lookup
  patient(id: ID!): Patient
  patientById(id: ID!): Patient
  #  Admin Patient KPIs (authoritative counts)
  patientStats: PatientStats!
  patients(cursor: String, limit: Int, search: String): PatientConnection!
  publicReviews(limit: Int): [Review!]! @aws_api_key @aws_cognito_user_pools
  recentBookings(limit: Int): [Booking!]!
  #  Report Queries
  reportById(id: ID!): Report
  reportsByPatient(patientId: ID!): [Report!]!
  reviewByBooking(bookingId: ID!): Review
  #  Review Queries
  reviewById(id: ID!): Review
  #  Admin Review KPIs (authoritative aggregates)
  reviewStats: ReviewStats!
  reviewsByPatient(patientId: ID!): [Review!]!
  serviceById(id: ID!): ServiceItem
  serviceBySlug(slug: String!): ServiceItem @aws_api_key @aws_cognito_user_pools
  staffById(id: ID!): Staff
  testById(id: ID!): TestItem
  testBySlug(slug: String!): TestItem @aws_api_key @aws_cognito_user_pools
}

