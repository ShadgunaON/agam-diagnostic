schema {
  query: Query
  mutation: Mutation
}

type Query {

  # Catalog Queries
  catalogTests(page: Int, limit: Int, q: String): CatalogTestsConnection! @aws_api_key @aws_cognito_user_pools
  catalogPackages(page: Int, limit: Int, q: String): CatalogPackagesConnection! @aws_api_key @aws_cognito_user_pools
  catalogServices(page: Int, limit: Int, q: String): CatalogServicesConnection! @aws_api_key @aws_cognito_user_pools
  testBySlug(slug: String!): TestItem @aws_api_key @aws_cognito_user_pools
  packageBySlug(slug: String!): PackageItem @aws_api_key @aws_cognito_user_pools
  serviceBySlug(slug: String!): ServiceItem @aws_api_key @aws_cognito_user_pools
  
  # Blog Queries
  blogs(page: Int, limit: Int, status: String): [BlogItem!]! @aws_api_key @aws_cognito_user_pools
  blogById(idOrSlug: String!): BlogItem @aws_api_key @aws_cognito_user_pools
  
  # Patient Queries
  mePatient: Patient
  patientById(id: ID!): Patient
  patients(limit: Int, cursor: String, search: String): PatientConnection!
  
  # Booking Queries
  bookingsByPatient(patientId: ID!): [Booking!]!
  recentBookings(limit: Int): [Booking!]!
  
  # Collection Queries
  collectionById(id: ID!): CollectionTask
  collectionsByPatient(patientId: ID!): [CollectionTask!]!
  collections(limit: Int, cursor: String, status: String, search: String): CollectionConnection!
  
  # Report Queries
  reportById(id: ID!): Report
  reportsByPatient(patientId: ID!): [Report!]!
  
  # Invoice Queries
  invoicesByPatient(patientId: ID!): [Invoice!]!
  
  # Document Queries
  documents(entityType: String, entityId: ID): [DocumentItem!]!
  documentById(id: ID!): DocumentItem
  documentDownloadUrl(id: ID!): String!
  
  # Review Queries
  reviewById(id: ID!): Review
  reviewsByPatient(patientId: ID!): [Review!]!
  reviewByBooking(bookingId: ID!): Review
  publicReviews(limit: Int): [Review!]! @aws_api_key @aws_cognito_user_pools
  allReviews(limit: Int, cursor: String): ReviewConnection!
  
  # Newsletter
  newsletterSubscribers(limit: Int, cursor: String): SubscriberConnection!

  # Direct Lookup
  patient(id: ID!): Patient

  # Targeted single-record lookups (replaces REST GET /api/bookings/:id and /api/invoices/:id)
  bookingById(id: ID!): Booking
  invoiceById(id: ID!): FullInvoice
  testById(id: ID!): TestItem
  packageById(id: ID!): PackageItem
  serviceById(id: ID!): ServiceItem

  # Patient-scoped booking list (replaces REST GET /api/bookings?patientId=)
  myBookings: [Booking!]!

  # Patient portal notifications (replaces REST GET /api/notifications)
  myNotifications: [Notification!]!

  # Aggregated Search
  globalSearch(query: String!, limit: Int): [GlobalSearchResult!]! @aws_api_key @aws_cognito_user_pools
  
  # Admin Dashboard
  dashboardStats: DashboardMetrics!

  # Admin Analytics Charts (revenue aggregated server-side)
  analyticsCharts: AnalyticsCharts!

  # Admin Patient KPIs (authoritative counts)
  patientStats: PatientStats!

  # Admin Review KPIs (authoritative aggregates)
  reviewStats: ReviewStats!

  # Admin Bookings Workspace (paginated; replaces REST GET /api/bookings)
  adminBookingsWorkspace(limit: Int, cursor: String, status: String, tab: String, sort: String, search: String): AdminBookingsWorkspace!

  # Admin Invoices Workspace (paginated; replaces REST GET /api/invoices)
  adminInvoicesWorkspace(limit: Int, cursor: String, status: String, search: String): AdminInvoicesWorkspace!

  # Admin Reviews Workspace (paginated; replaces REST GET /api/reviews)
  adminReviewsWorkspace(limit: Int, cursor: String, status: String, rating: String, search: String): AdminReviewsWorkspace!
  
  # Admin Collections Workspace
  adminCollectionsWorkspace(limit: Int, cursor: String, tab: String, sort: String, search: String): CollectionsWorkspaceData!
  
  # Admin Reports Workspace
  adminReportsWorkspace(limit: Int, cursor: String, status: String, sort: String, search: String): AdminReportsWorkspaceData!
  
  # Admin Catalog Workspace
  adminCatalogWorkspace: CatalogWorkspace!
  
  # Patient Portal
  myPortal: MyPortal!

  # Staff Management
  adminStaffWorkspace: [Staff!]!
  staffById(id: ID!): Staff
  adminRoles: [Role!]! @aws_cognito_user_pools
  adminPermissionsMap: String!
}

type Mutation {

  # Catalog Mutations
  createCatalogTest(input: String!): TestItem!
  updateCatalogTest(id: ID!, input: String!): TestItem!
  updateCatalogTestStatus(id: ID!, status: String!): Boolean!
  deleteCatalogTest(id: ID!): Boolean!
  
  createCatalogPackage(input: String!): PackageItem!
  updateCatalogPackage(id: ID!, input: String!): PackageItem!
  updateCatalogPackageStatus(id: ID!, status: String!): Boolean!
  deleteCatalogPackage(id: ID!): Boolean!
  
  createCatalogService(input: String!): ServiceItem!
  updateCatalogService(id: ID!, input: String!): ServiceItem!
  updateCatalogServiceStatus(id: ID!, status: String!): Boolean!
  deleteCatalogService(id: ID!): Boolean!
  
  # Blog Mutations
  createBlog(input: String!): BlogItem!
  updateBlog(id: ID!, input: String!): BlogItem!
  deleteBlog(id: ID!): Boolean!
  
  # Patient Mutations
  createPatient(input: String!): Patient!
  updatePatient(id: ID!, input: String!): Patient!
  
  # Booking Mutations
  createBooking(input: String!, idempotencyKey: String): Booking!
  updateBookingStatus(id: ID!, status: String!): Boolean!
  updateBookingPaymentStatus(id: ID!, status: String!): Boolean!
  
  # Collection Mutations
  createCollection(input: String!): CollectionTask!
  updateCollection(id: ID!, input: String!): CollectionTask!
  
  # Report Mutations
  createReportTask(input: String!): Report!
  updateReportStatus(id: ID!, status: String!, results: String): Boolean!
  
  # Invoice Mutations
  createInvoice(input: String!): Invoice!
  updateInvoiceStatus(id: ID!, status: String!): Boolean!
  updateInvoicePaymentMethod(id: ID!, method: String!): Boolean!
  updateInvoice(id: ID!, input: String!): Invoice!
  
  # Document Mutations
  initiateDocumentUpload(input: String!): DocumentUploadResponse!
  completeDocumentUpload(id: ID!): DocumentItem!
  
  # Review Mutations
  createReview(input: String!): Review!
  moderateReview(id: ID!, status: String!): Boolean!
  
  # Newsletter Mutations
  newsletterSubscribe(email: String!): Boolean!

  # Mark a notification as read (replaces REST PUT /api/notifications/:id/read)
  markNotificationRead(id: ID!): Boolean!

  # Payment processing
  createPaymentOrder(invoiceId: ID!): String!
  paymentStatus(invoiceId: ID!): FullInvoice!

  # Staff Management
  createStaff(name: String!, email: String!, phone: String!, role: String!, department: String!, shift: String!): Staff!
  updateStaff(id: ID!, name: String, email: String, phone: String, role: String, department: String, shift: String, status: String): Staff!
  createRole(title: String!, internal: String!, desc: String, color: String): Role!
  updatePermissions(records: String!): Boolean!
}

type GlobalSearchResult {
  id: ID!
  type: String!
  title: String!
  subtitle: String!
  href: String!
  icon: String!
}



type DashboardMetrics {
  totalPatients: Int
  pendingBookings: Int!
  awaitingVerification: Int
  revenueToday: Float!
  bookingsToday: Int!
  homeCollections: Int!
}

type AnalyticsCharts {
  revenueByMonth: [MonthlyRevenue!]!
}

type MonthlyRevenue {
  month: String!
  revenue: Float!
}

type PatientStats {
  totalPatients: Int!
  newThisMonth: Int!
  # retentionRate is intentionally omitted: no authoritative definition exists
}

type ReviewStats {
  total: Int!
  pending: Int!
  approved: Int!
  averageRating: Float!
}

type MyPortal {
  patient: Patient!
  familyMembers: [Patient!]!
  bookings: [Booking!]!
  invoices: [Invoice!]!
  reviews: [Review!]!
  collections: [CollectionTask!]!
  reports: [Report!]!
}

type Patient {
  id: ID!
  name: String!
  email: String
  phone: String
  status: String
  createdAt: String
  age: Int
  gender: String
  bloodGroup: String
  relation: String
  dobOrAge: String
  ownerSub: String
  updatedAt: String
  
  # Relational fields to be resolved by targeted queries, not fetch-all
  bookings(status: String): [Booking!]!
  reports(status: String): [Report!]!
  invoices(paymentStatus: String): [Invoice!]!
}

type Booking {
  id: ID!
  patientId: ID!
  status: String!
  createdAt: String!
  collection: CollectionDetails
  payment: PaymentDetails
  items: [BookingItem!]!
  patient: PatientSnapshot!
}

type BookingItem {
  name: String!
  type: String!
}

type PatientSnapshot {
  id: ID
  name: String!
  phone: String
  email: String
}

type CollectionDetails {
  type: String
  status: String
  date: String
  timeSlot: String
  address: String
}

type PaymentDetails {
  status: String
  total: Float
  method: String
}

type TestResult {
  parameter: String!
  value: String
  unit: String
  reference: String
  isAbnormal: Boolean
}

type Report {
  id: ID!
  patientId: ID!
  bookingId: ID
  status: String!
  priority: String
  createdAt: String!
  testType: String!
  time: String
  url: String
  pdfKey: String
  patient: PatientSnapshot!
  results: [TestResult!]
}

type Invoice {
  id: ID!
  patientId: ID!
  bookingId: ID
  paymentStatus: String!
  paymentMethod: String
  total: Float!
  createdAt: String!
}

type TestItem @aws_api_key @aws_cognito_user_pools {
  id: ID!
  title: String!
  slug: String!
  category: String
  tag: String
  price: Float!
  status: String
  description: String
  sampleType: String
  faqs: [FaqItem!]
  relatedTests: [RelatedTest!]
  basePrice: Float
  salePrice: Float
  sortOrder: Int
  turnaroundTime: String
  fastingRequired: Boolean
  homeCollectionAvailable: Boolean
  labCollectionAvailable: Boolean
  createdAt: String
  updatedAt: String
}

type PackageItem @aws_api_key @aws_cognito_user_pools {
  id: ID!
  title: String!
  slug: String!
  category: String
  price: Float!
  status: String
  description: String
  packagePrice: Float
  individualValue: Float
  sortOrder: Int
  testIds: [String!]
  includes: [String!]
  faqs: [FaqItem!]
  createdAt: String
  updatedAt: String
}

type ServiceItem @aws_api_key @aws_cognito_user_pools {
  id: ID!
  title: String!
  slug: String!
  category: String
  price: Float!
  status: String
  description: String
  shortDescription: String
  basePrice: Float
  salePrice: Float
  sortOrder: Int
  estimatedDuration: String
  homeAvailable: Boolean
  labAvailable: Boolean
  faqs: [FaqItem!]
  createdAt: String
  updatedAt: String
}

type FaqItem {
  question: String!
  answer: String!
}

type RelatedTest {
  title: String!
  category: String
  description: String
  slug: String!
  status: String
}

type Review @aws_api_key @aws_cognito_user_pools {
  id: ID!
  patientId: ID
  bookingId: ID!
  status: String!
  displayName: String
  rating: Float
  title: String
  content: String
  createdAt: String
  updatedAt: String
}

type Notification {
  id: ID!
  userId: ID!
  title: String!
  message: String!
  isRead: Boolean!
  link: String
  createdAt: String
}

# Full invoice — all financial fields (richer than the summary Invoice type)
type FullInvoice {
  id: ID!
  patientId: ID!
  bookingId: ID
  paymentStatus: String!
  paymentMethod: String
  paidAt: String
  total: Float!
  subtotal: Float
  discount: Float
  tax: Float
  receivedBy: String
  createdAt: String!
  updatedAt: String
  items: [InvoiceLineItem!]
}

type InvoiceLineItem {
  id: ID!
  name: String!
  type: String!
  price: Float!
}

# Admin workspace types
type AdminBookingsWorkspace {
  queue: [Booking!]!
  nextCursor: String
  totalFiltered: Int
}

type AdminInvoice {
  id: ID!
  patientId: ID!
  bookingId: ID
  paymentStatus: String!
  paymentMethod: String
  total: Float!
  subtotal: Float
  tax: Float
  discount: Float
  paidAt: String
  receivedBy: String
  createdAt: String!
  updatedAt: String
  items: [InvoiceLineItem!]
}

type AdminInvoicesWorkspace {
  queue: [AdminInvoice!]!
  nextCursor: String
}

type AdminReview {
  id: ID!
  patientId: ID
  bookingId: ID!
  displayName: String
  status: String!
  rating: Float
  title: String
  content: String
  createdAt: String
  updatedAt: String
}

type AdminReviewsWorkspace {
  queue: [AdminReview!]!
  nextCursor: String
}

type CatalogWorkspace {
  tests: [TestItem!]!
  services: [ServiceItem!]!
  packages: [PackageItem!]!
}

type CollectionTask {
  id: ID!
  bookingId: ID!
  status: String!
  assignedTo: String
}

type CollectionsWorkspaceData {
  queue: CollectionConnection!
  stats: CollectionStats!
  phlebotomists: [Staff!]!
}

type CollectionConnection {
  items: [CollectionQueueItem!]!
  nextCursor: String
}

type CollectionQueueItem {
  id: ID!
  date: String
  time: String
  status: String!
  patient: String
  address: String
  bookingId: ID!
  assignedTo: String
  phlebotomistId: String
  type: String
  lat: Float
  lng: Float
  tests: [String!]
}

type CollectionStats {
  totalTasks: Int!
  completedTasks: Int!
  enRouteTasks: Int!
  unassignedTasks: Int!
}

type Staff {
  id: ID!
  name: String!
  role: String!
  department: String
  phone: String
  email: String
  shift: String
  joinDate: String
  status: String!
}

type Role {
  id: ID!
  title: String!
  internal: String!
  users: Int!
  desc: String
  color: String
  scope: String
}

# Legacy alias preserved for existing resolver
type AdminReportsWorkspaceData {
  queue: [Report!]!
  nextCursor: String
  pendingCount: Int
}


type CatalogTestsConnection @aws_api_key @aws_cognito_user_pools { data: [TestItem!]!, meta: PaginationMeta! }
type CatalogPackagesConnection @aws_api_key @aws_cognito_user_pools { data: [PackageItem!]!, meta: PaginationMeta! }
type CatalogServicesConnection @aws_api_key @aws_cognito_user_pools { data: [ServiceItem!]!, meta: PaginationMeta! }
type BlogConnection @aws_api_key @aws_cognito_user_pools { data: [BlogItem!]!, meta: PaginationMeta! }
type PatientConnection { data: [Patient!]!, meta: PaginationMeta! }
type ReviewConnection @aws_api_key @aws_cognito_user_pools { data: [Review!]!, meta: PaginationMeta! }
type SubscriberConnection @aws_api_key @aws_cognito_user_pools { data: [Subscriber!]!, meta: PaginationMeta! }

type PaginationMeta @aws_api_key @aws_cognito_user_pools { total: Int!, page: Int!, limit: Int!, totalPages: Int! }

type BlogItem @aws_api_key @aws_cognito_user_pools {
  id: ID!
  slug: String!
  title: String!
  description: String
  excerpt: String
  content: String
  date: String
  category: String
  author: String
  authorId: String
  icon: String
  colorPrimary: String
  colorSecondary: String
  imageUrl: String
  image: String
  status: String!
  views: Int
  publishedAt: String
  createdAt: String
  updatedAt: String
  coverImage: String
}

type DocumentItem {
  id: ID!
  entityType: String!
  entityId: ID!
  title: String!
  type: String!
  url: String!
  createdAt: String
  uploadedBy: String
}

type DocumentUploadResponse {
  id: ID!
  uploadUrl: String!
}

type Subscriber {
  id: ID!
  email: String!
  subscribedAt: String!
  status: String
}
