AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Agam Diagnostics AWS Foundation
  SAM Template for Production Serverless Backend — GraphQL/AppSync + Cognito

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref AgamDynamoDBTable
        S3_BUCKET_NAME: !Ref AgamStorageBucket

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - uat
      - prod
    Description: Deployment environment

  PhonePeEnv:
    Type: String
    Default: "UAT"
    Description: PhonePe Environment (UAT or PROD)

Resources:
  # ==========================================================
  # COGNITO FOUNDATION
  # ==========================================================
  AgamUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "agam-users-${Environment}"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
            - EMAIL_OTP
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - phone_number
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: phone_number
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: role
          AttributeDataType: String
          Required: false
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageTemplate:
          EmailMessage: "Welcome to Agam Diagnostics! Your account has been created. Your username is {username} and your temporary password is: {####}. Please log in to change your password and access your account."
          EmailSubject: "Welcome to Agam Diagnostics - Your Temporary Password"
      LambdaConfig:
        DefineAuthChallenge: !GetAtt DefineAuthChallengeFunction.Arn
        CreateAuthChallenge: !GetAtt CreateAuthChallengeFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeResponseFunction.Arn
      UserPoolTags:
        Project: AgamDiagnostics
        Environment: !Ref Environment
        ManagedBy: SAM

  AgamUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "agam-diagnostics-${Environment}-${AWS::AccountId}"
      UserPoolId: !Ref AgamUserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref AgamUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: "placeholder-google-client-id" # Manual configuration required
        client_secret: "placeholder-google-client-secret" # Manual configuration required
        authorize_scopes: "email openid profile"
      AttributeMapping:
        email: email
        phone_number: phoneNumbers
        username: sub

  AgamUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub "agam-web-client-${Environment}"
      UserPoolId: !Ref AgamUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - Google
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - "http://localhost:3000/api/auth/callback"
      LogoutURLs:
        - "http://localhost:3000/"

  # ==========================================================
  # DYNAMODB FOUNDATION
  # ==========================================================
  AgamDynamoDBTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "agam-data-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: AgamDiagnostics
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  # ==========================================================
  # S3 STORAGE FOUNDATION
  # ==========================================================
  AgamStorageBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "agam-storage-${AWS::AccountId}-${AWS::Region}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: AgamDiagnostics
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  # ==========================================================
  # IAM & LAMBDA FOUNDATION
  # Shared role used by Cognito auth trigger Lambdas
  # ==========================================================
  AgamLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgamDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt AgamDynamoDBTable.Arn
                  - !Sub "${AgamDynamoDBTable.Arn}/index/*"
        - PolicyName: AgamS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${AgamStorageBucket.Arn}/*"
        - PolicyName: AgamSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agam/SuperAdminSub"
        - PolicyName: AgamCognitoAdminAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminGetUser
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"

  # ==========================================================
  # COGNITO CUSTOM AUTH TRIGGERS
  # Required for OTP/custom auth challenge flow
  # ==========================================================
  DefineAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/auth-triggers/define-auth-challenge.js
    Properties:
      CodeUri: .
      Handler: src/handlers/auth-triggers/define-auth-challenge.handler
      Role: !GetAtt AgamLambdaExecutionRole.Arn

  CreateAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/auth-triggers/create-auth-challenge.js
    Properties:
      CodeUri: .
      Handler: src/handlers/auth-triggers/create-auth-challenge.handler
      Role: !GetAtt AgamLambdaExecutionRole.Arn

  VerifyAuthChallengeResponseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/auth-triggers/verify-auth-challenge-response.js
    Properties:
      CodeUri: .
      Handler: src/handlers/auth-triggers/verify-auth-challenge-response.handler
      Role: !GetAtt AgamLambdaExecutionRole.Arn

  DefineAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DefineAuthChallengeFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt AgamUserPool.Arn

  CreateAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CreateAuthChallengeFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt AgamUserPool.Arn

  VerifyAuthChallengeResponsePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt VerifyAuthChallengeResponseFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt AgamUserPool.Arn

  # ==========================================================
  # GRAPHQL / APPSYNC FOUNDATION
  # The sole application API surface
  # ==========================================================
  GraphQLResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/graphql.handler
      Environment:
        Variables:
          PHONEPE_SSM_PREFIX: !Sub "/agam/phonepe/${Environment}"
          PHONEPE_ENV: !Ref PhonePeEnv
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgamDynamoDBTable
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameters
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agam/phonepe/${Environment}/*"

  GraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub "agam-graphql-${Environment}"
      AuthenticationType: AMAZON_COGNITO_USER_POOLS
      UserPoolConfig:
        UserPoolId: !Ref AgamUserPool
        AwsRegion: !Ref "AWS::Region"
        DefaultAction: ALLOW

  GraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      DefinitionS3Location: schema.graphql

  GraphQLDataSourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeGraphQLResolver
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GraphQLResolverFunction.Arn

  GraphQLDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: SharedLambdaDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt GraphQLDataSourceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GraphQLResolverFunction.Arn

  # Resolvers mapped to the shared Lambda data source
  GraphQLResolverQueryPatient:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: patient
      DataSourceName: !GetAtt GraphQLDataSource.Name

  GraphQLResolverQueryGlobalSearch:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: globalSearch
      DataSourceName: !GetAtt GraphQLDataSource.Name

  GraphQLResolverQueryDashboardStats:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: dashboardStats
      DataSourceName: !GetAtt GraphQLDataSource.Name

  GraphQLResolverPatientBookings:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Patient
      FieldName: bookings
      DataSourceName: !GetAtt GraphQLDataSource.Name

  GraphQLResolverPatientReports:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Patient
      FieldName: reports
      DataSourceName: !GetAtt GraphQLDataSource.Name

  GraphQLResolverPatientInvoices:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Patient
      FieldName: invoices
      DataSourceName: !GetAtt GraphQLDataSource.Name

Outputs:
  CognitoUserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref AgamUserPool

  CognitoClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref AgamUserPoolClient

  DynamoDBTableName:
    Description: "DynamoDB Table Name"
    Value: !Ref AgamDynamoDBTable

  S3BucketName:
    Description: "S3 Storage Bucket Name"
    Value: !Ref AgamStorageBucket

  AppSyncEndpoint:
    Description: "GraphQL AppSync API Endpoint — the sole application API surface"
    Value: !GetAtt GraphQLApi.GraphQLUrl
